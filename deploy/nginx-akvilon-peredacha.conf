server {
    listen 80;
    server_name akvilon-peredacha.ru www.akvilon-peredacha.ru lk.akvilon-peredacha.ru;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name akvilon-peredacha.ru www.akvilon-peredacha.ru;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/akvilon-peredacha.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akvilon-peredacha.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/peredacha/landing;
    index index.html;
    client_max_body_size 2M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        limit_req zone=peredacha_general burst=60 nodelay;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}

server {
    listen 443 ssl http2;
    server_name lk.akvilon-peredacha.ru;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/lk.akvilon-peredacha.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lk.akvilon-peredacha.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /static/ {
        alias /opt/peredacha/app/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /login {
        limit_req zone=peredacha_general burst=60 nodelay;
        limit_req zone=peredacha_login burst=8 nodelay;
        proxy_hide_header Strict-Transport-Security;
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn-crm_flask.sock;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        limit_req zone=peredacha_general burst=60 nodelay;
        proxy_hide_header Strict-Transport-Security;
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn-crm_flask.sock;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
