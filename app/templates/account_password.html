{% extends "base.html" %}
{% block layout_mode %}settings{% endblock %}
{% block title %}Сменить пароль{% endblock %}
{% block content %}
<section class="account-page">
  <div class="page-head account-page-head">
    <div>
      <a class="account-back-button" href="{{ url_for('main.account') }}"><i class="bi bi-arrow-left" aria-hidden="true"></i><span>Аккаунт</span></a>
      <h1 class="page-title">Сменить пароль</h1>
    </div>
  </div>

  <article class="card content-card account-card account-password-page-card">
    <div class="card-body">
      <form class="account-password-form" method="post" action="{{ url_for('main.account_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="account-password-grid">
          <label class="account-password-field" for="accountCurrentPassword">
            <span>Текущий пароль</span>
            <input class="form-control account-profile-input" id="accountCurrentPassword" name="current_password" type="password" autocomplete="current-password" required>
          </label>
          <label class="account-password-field" for="accountNewPassword">
            <span>Новый пароль</span>
            <input class="form-control account-profile-input" id="accountNewPassword" name="new_password" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <label class="account-password-field" for="accountConfirmPassword">
            <span>Повторите пароль</span>
            <input class="form-control account-profile-input" id="accountConfirmPassword" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
          </label>
        </div>
        <button class="btn btn-primary account-password-submit" type="submit"><i class="bi bi-check2-circle me-2"></i>Сменить пароль</button>
      </form>
    </div>
  </article>
</section>
{% endblock %}
