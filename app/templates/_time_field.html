{% macro time_field(name,value='',optional=false,id='',step=15) -%}
<span class="crm-time-field" data-time-field data-time-step="{{ step }}"><input class="form-control workflow-time-select" type="text" name="{{ name }}" value="{{ value }}" {% if id %}id="{{ id }}"{% endif %} inputmode="numeric" autocomplete="off" placeholder="ЧЧ:ММ" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" maxlength="5" {% if not optional %}required{% endif %} aria-label="Время: {{ name }}"><button class="crm-time-open" type="button" aria-label="Выбрать время из списка" aria-expanded="false"><i class="bi bi-chevron-down" aria-hidden="true"></i></button></span>
{%- endmacro %}
